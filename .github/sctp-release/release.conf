# Settings for the automated SCTP release pipeline (sctp-release.yml).
# Sourced by the scripts in this directory.

# Upstream Go repository and the branch Go development happens on.
UPSTREAM_URL=https://github.com/golang/go
UPSTREAM_DEV_BRANCH=master

# Branch in this fork that carries the SCTP series on top of upstream
# development. New release lines (a Go minor version that has no SCTP
# release branch yet) are ported from here.
SCTP_DEV_BRANCH=sctp/go1.28

# Oldest Go minor version to release. Only the newest patch release of each
# minor version from this one onwards is considered.
MIN_MINOR=27

# Release branches are named "${RELEASE_BRANCH_PREFIX}go1.N". They are kept
# out of the sctp/** namespace so the development CI does not also run on them.
RELEASE_BRANCH_PREFIX=release/sctp-

# Label on the issue opened when a release cannot be cut. While an open issue
# with this label names a version, the daily run skips that version; close
# the issue to retry.
BLOCKED_LABEL=sctp-release-blocked
